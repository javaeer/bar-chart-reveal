name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 最小权限原则：CI 仅读取代码，不写任何作用域
permissions:
  contents: read

jobs:
  # 快速通道：零依赖纯逻辑单元测试 + 构建（不需要浏览器 / GL）
  unit:
    name: 单元测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 纯逻辑单元测试（配置规范化 / 数据健壮性）
        run: npm test
      - name: 生产构建
        run: npm run build
      - name: 单文件构建（离线可打开）
        run: npm run build:single
      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # 重通道：需要 chromium + Xvfb 的视觉 / 交互 QA
  qa:
    name: 视觉与交互 QA
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 安装 chromium / xvfb / 中文字体 / ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser xvfb fonts-noto-cjk x11-utils ffmpeg
      - name: 生产构建
        run: npm run build
      - name: 交互回归
        env:
          CHROMIUM_PATH: /usr/bin/chromium-browser
        run: node scripts/qa/interact.mjs
      - name: 构图 / 确定性 / 标签硬指标
        env:
          CHROMIUM_PATH: /usr/bin/chromium-browser
        run: node scripts/qa/verify.mjs
