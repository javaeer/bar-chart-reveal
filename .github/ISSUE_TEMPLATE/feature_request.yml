name: 功能建议 (Feature Request)
description: 提出一个新功能或改进
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: usecase
    attributes:
      label: 使用场景
      description: 你遇到了什么情况，需要什么能力？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望如何工作 / 希望新增什么
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 参考（可选）
      description: 其他可行思路，或你见过的类似实现
    validations:
      required: false
